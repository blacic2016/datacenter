services:
  postgres:
    image: postgres:16-alpine
    container_name: daedalous-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: daedalous
      POSTGRES_PASSWORD: daedalous
      POSTGRES_DB: daedalous
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
